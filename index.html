<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Fast offline Snake game - installable PWA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Snake Offline</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      overflow: hidden;
      touch-action: none;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
      color: #22c55e;
    }

    .score-board {
      display: flex;
      gap: 2rem;
      margin-bottom: 0.75rem;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .score-board span {
      color: #94a3b8;
    }

    .score-board strong {
      color: #f8fafc;
    }

    #game-container {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 0 3px #1e293b, 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    canvas {
      display: block;
      background: #020617;
      max-width: 100vw;
      max-height: 70vh;
    }

    .controls {
      margin-top: 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .btn {
      background: #22c55e;
      color: #0f172a;
      border: none;
      padding: 0.7rem 1.8rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn:hover {
      background: #16a34a;
    }

    .hint {
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
      max-width: 280px;
      line-height: 1.4;
    }

    /* Mobile D-pad */
    .dpad {
      display: none;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(3, 56px);
      gap: 6px;
      margin-top: 0.5rem;
    }

    .dpad button {
      width: 56px;
      height: 56px;
      border: none;
      border-radius: 12px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dpad button:active {
      background: #334155;
    }

    .dpad .up    { grid-column: 2; grid-row: 1; }
    .dpad .left  { grid-column: 1; grid-row: 2; }
    .dpad .right { grid-column: 3; grid-row: 2; }
    .dpad .down  { grid-column: 2; grid-row: 3; }

    @media (max-width: 600px), (pointer: coarse) {
      .dpad {
        display: grid;
      }
      .hint {
        display: none;
      }
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 10;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h2 {
      font-size: 1.8rem;
      color: #f8fafc;
    }

    .overlay p {
      color: #94a3b8;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <h1>🐍 SNAKE</h1>

  <div class="score-board">
    <div>Score: <strong id="score">0</strong></div>
    <div>Best: <strong id="best">0</strong></div>
  </div>

  <div id="game-container">
    <canvas id="game" width="400" height="400"></canvas>

    <div id="start-screen" class="overlay">
      <h2>Snake Offline</h2>
      <p>Eat the food. Don't hit yourself.</p>
      <button class="btn" id="start-btn">Play</button>
    </div>

    <div id="game-over" class="overlay hidden">
      <h2>Game Over</h2>
      <p>Score: <span id="final-score">0</span></p>
      <button class="btn" id="restart-btn">Play Again</button>
    </div>
  </div>

  <div class="controls">
    <div class="dpad">
      <button class="up" data-dir="up">▲</button>
      <button class="left" data-dir="left">◀</button>
      <button class="right" data-dir="right">▶</button>
      <button class="down" data-dir="down">▼</button>
    </div>
    <p class="hint">Use arrow keys or swipe • Works offline</p>
  </div>

  <script src="game.js"></script>
  <script>
    // Register Service Worker for offline support
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(reg => console.log("SW registered", reg.scope))
          .catch(err => console.log("SW registration failed", err));
      });
    }
  </script>
</body>
</html>
